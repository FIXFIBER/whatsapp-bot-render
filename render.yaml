# Render Blueprint for the WhatsApp bot (Baileys + Express + socket.io).
# Docker runtime pins Node 20 in the Dockerfile, so no CLI/manual env step is needed.
# Deploy via Dashboard: New → Blueprint, or `render services create`.
services:
  - type: web
    name: whatsapp-bot
    runtime: docker
    repo: https://github.com/FIXFIBER/whatsapp-bot-render
    branch: main
    rootDirectory: .
    healthCheckPath: /
    autoDeploy: true
    envVars:
      - key: DISABLE_TUNNEL      # bot auto-starts a Cloudflare tunnel locally; disable on Render
        value: "1"
      - key: SESSION_DIR         # persist WhatsApp auth on the attached disk
        value: /data/session
      - key: CACHE_DIR
        value: /data/cache
      - key: ADMIN_PASSWORD      # set this secret in the dashboard (do NOT commit)
        sync: false
    disks:
      - name: botdata
        mountPath: /data
        sizeGB: 1
