# Render Blueprint for the WhatsApp bot (Baileys + Express + socket.io).
# Docker runtime pins Node20 in the Dockerfile, so no CLI/manual env step is needed.
# No /data disk required to boot: session/cache default to ./session ./cache in the
# writable project dir. After you attach a disk at /data in the dashboard, set
# SESSION_DIR=/data/session and CACHE_DIR=/data/cache for persistence.
services:
  - type: web
    name: whatsapp-bot
    runtime: docker
    repo: https://github.com/FIXFIBER/whatsapp-bot-render
    branch: main
    rootDirectory: .
    healthCheckPath: /
    autoDeploy: true
    envVars:
      - key: DISABLE_TUNNEL      # bot auto-starts a Cloudflare tunnel locally; disable on Render
        value: "1"
      - key: ADMIN_PASSWORD      # set this secret in the dashboard (do NOT commit)
        sync: false
