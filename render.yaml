# Render Blueprint for the WhatsApp bot (Baileys + Express + socket.io).
# Deploy via Dashboard: New → Blueprint, or `render services create` (disk ignored on CLI; attach /data in dashboard).
services:
  - type: web
    name: whatsapp-bot
    runtime: node
    repo: https://github.com/FIXFIBER/whatsapp-bot-render
    branch: main
    rootDirectory: .
    buildCommand: npm install
    startCommand: node whats.js
    healthCheckPath: /
    autoDeploy: true
    envVars:
      - key: NODE_VERSION
        value: "20"
      - key: DISABLE_TUNNEL      # bot auto-starts a Cloudflare tunnel locally; disable on Render
        value: "1"
      - key: SESSION_DIR         # persist WhatsApp auth on the attached disk
        value: /data/session
      - key: CACHE_DIR
        value: /data/cache
      - key: ADMIN_PASSWORD      # set this secret in the dashboard (do NOT commit)
        sync: false
    disks:
      - name: botdata
        mountPath: /data
        sizeGB: 1
